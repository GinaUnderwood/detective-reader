services:
  app:
    build:
      context: .
    image: detective-reader:local
    restart: unless-stopped
    environment:
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:?Set AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:?Set AZURE_SPEECH_REGION}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-en-US-AvaNeural}
      AZURE_SPEECH_FORMAT: ${AZURE_SPEECH_FORMAT:-audio-24khz-48kbitrate-mono-mp3}
      AZURE_SPEECH_PITCH: ${AZURE_SPEECH_PITCH:--6%}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - speech_cache:/app/cache
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  speech_cache:
